<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codesong Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #0e1014; color: #e6e8ec; padding: 32px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: #8b94a3; margin: 0 0 24px; font-size: 13px; }
      .panel { background: #171a21; border: 1px solid #242833; border-radius: 12px; padding: 20px; max-width: 720px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
      select, button {
        font: inherit; background: #222734; color: #e6e8ec; border: 1px solid #323848;
        border-radius: 8px; padding: 8px 14px; cursor: pointer;
      }
      button.primary { background: #4f8cff; border-color: #4f8cff; color: #06122b; font-weight: 600; }
      button:disabled { opacity: .4; cursor: default; }
      .meta { color: #9aa3b2; font-size: 13px; }
      .bar { height: 8px; background: #222734; border-radius: 6px; overflow: hidden; margin: 16px 0; }
      .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #4f8cff, #8a6bff); }
      .sections { display: flex; gap: 2px; margin-bottom: 6px; }
      .section { flex: 1; text-align: center; font-size: 11px; padding: 4px; background: #1d2230; border-radius: 4px; color: #9aa3b2; }
      .tracks { font-size: 13px; color: #c2c8d2; }
      .tracks div { padding: 2px 0; }
      code { background: #222734; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>♪ Codesong Studio</h1>
    <p class="sub">Live preview — edit a song file and it hot-reloads. Render to a file with <code>codesong render</code>.</p>
    <div class="panel">
      <div class="row">
        <select id="song"></select>
        <button id="play" class="primary">▶ Play</button>
        <button id="stop" disabled>■ Stop</button>
        <span class="meta" id="clock">0.0s</span>
      </div>
      <div class="sections" id="sections"></div>
      <div class="bar"><div id="progress"></div></div>
      <div class="meta" id="info"></div>
      <div class="tracks" id="tracks"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
